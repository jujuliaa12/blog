project:
  type: website
  # gh-pages 每次發佈都是強制覆寫，CNAME 必須跟著 render 進 _site/，
  # 否則自訂網域設定會被沖掉。
  resources:
    - CNAME

website:
  description: "Diagnostic notes on computer vision in small-data regimes — what breaks, why, and what the failure tells you that more capacity won't."
  site-url: https://blog.judayori.com/
  title: "notes.judayori"
  favicon: logo.svg
  navbar:
    logo: logo.svg
    logo-alt: "一隻戴眼鏡、在筆電前學寫程式的柴犬"
    right:
      # about.qmd 的 title 是「Julia Tseng」（給側欄用的），
      # 這裡要明確指定 text，否則導覽列會跟著顯示名字。
      - text: "About"
        href: about.qmd
      - icon: github
        href: https://github.com/jujuliaa12
      # 填上真實網址後把註解取消
      # - icon: bluesky
      #   href: https://bsky.app/profile/你的帳號
format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css



