<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 學寫程式的柴犬。導覽列實際顯示約 30px 高，
       所以刻意用大色塊、少細節，縮小後才不會糊成一團。 -->

  <!-- 耳朵 -->
  <path d="M13 25 L17 7 L30 18 Z" fill="#C97F35"/>
  <path d="M51 25 L47 7 L34 18 Z" fill="#C97F35"/>
  <path d="M18 22 L20 12 L27 19 Z" fill="#F2CBA3"/>
  <path d="M46 22 L44 12 L37 19 Z" fill="#F2CBA3"/>

  <!-- 胸口（被筆電擋住大半，只露一點） -->
  <ellipse cx="32" cy="44" rx="11" ry="8" fill="#E2954A"/>

  <!-- 頭 -->
  <ellipse cx="32" cy="25" rx="18" ry="15.5" fill="#E2954A"/>

  <!-- 口鼻周圍的白毛 -->
  <ellipse cx="32" cy="33" rx="12.5" ry="8" fill="#FBF3E6"/>
  <!-- 眉斑，柴犬的招牌 -->
  <ellipse cx="24.5" cy="17.5" rx="3.2" ry="2.4" fill="#FBF3E6"/>
  <ellipse cx="39.5" cy="17.5" rx="3.2" ry="2.4" fill="#FBF3E6"/>

  <!-- 眼鏡（在念書的暗示） -->
  <g fill="none" stroke="#3D3229" stroke-width="1.7">
    <circle cx="24.5" cy="24" r="6"/>
    <circle cx="39.5" cy="24" r="6"/>
    <path d="M30.5 24 H33.5"/>
  </g>
  <ellipse cx="24.5" cy="24" rx="2.5" ry="2.8" fill="#3D3229"/>
  <ellipse cx="39.5" cy="24" rx="2.5" ry="2.8" fill="#3D3229"/>

  <!-- 鼻子與嘴 -->
  <path d="M28.8 30 h6.4 a1.6 1.6 0 0 1 1.3 2.5 l-3.2 2.6 a1.6 1.6 0 0 1 -2.6 0 l-3.2 -2.6 a1.6 1.6 0 0 1 1.3 -2.5 z" fill="#3D3229"/>
  <path d="M32 35.5 v2.2 M32 37.7 q-3 2.6 -5.4 0 M32 37.7 q3 2.6 5.4 0"
        fill="none" stroke="#3D3229" stroke-width="1.4" stroke-linecap="round"/>

  <!-- 筆電螢幕 -->
  <rect x="16.5" y="43.5" width="31" height="10" rx="1.8" fill="#2E3A45"/>
  <!-- 螢幕上的程式碼 -->
  <rect x="20" y="46.3" width="7" height="1.5" rx="0.75" fill="#7FD1A0"/>
  <rect x="28.5" y="46.3" width="11" height="1.5" rx="0.75" fill="#8FB8D8"/>
  <rect x="20" y="49.6" width="14" height="1.5" rx="0.75" fill="#FBF3E6" opacity="0.75"/>

  <!-- 筆電底座 -->
  <path d="M13.5 53.5 H50.5 L55 58.5 H9 Z" fill="#7A8896"/>
  <!-- 前爪搭在鍵盤上 -->
  <ellipse cx="17.5" cy="56" rx="3.4" ry="2" fill="#FBF3E6"/>
  <ellipse cx="46.5" cy="56" rx="3.4" ry="2" fill="#FBF3E6"/>
</svg>
